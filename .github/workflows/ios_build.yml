name: Build iOS IPA & Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Supabase Secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_LOCAL_JSON }}" ]; then
            echo '${{ secrets.SUPABASE_LOCAL_JSON }}' > supabase.local.json
          elif [ -f "supabase.local.json" ]; then
            echo "Using existing repository supabase.local.json configuration."
          else
            echo '{"SUPABASE_URL":"https://oflqzgnbpbufoxzynaoq.supabase.co","SUPABASE_PUBLISHABLE_KEY":"sb_publishable_FwtdXZHRA0k-mEIzUO20lA_RBbNo_Gu"}' > supabase.local.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release Mode)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=supabase.local.json

      - name: Package Application into IPA File
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 sanai3y.ipa Payload
          ls -lh sanai3y.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanai3y-ios-ipa
          path: sanai3y.ipa
          retention-days: 30

      - name: Generate Release Tag & Name
        id: release_info
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || format('v1.0.0-build.{0}', github.run_number) }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "Sanai3y iOS App - ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ### 📱 تطبيق صنايعي لنظام iOS (Sanai3y App)
            
            تم بناء التطبيق وتغليفه تلقائياً بصيغة **IPA** جاهز للتحميل والتثبيت على أجهزة iPhone.
            
            #### 📥 رابط التحميل المباشر:
            - قم بتحميل ملف **`sanai3y.ipa`** المرفق أسفل هذا الإصدار.
            
            #### 🛠 خطوات التثبيت السريع على الآيفون (بدون اشتراك مطور عبر Sideloadly):
            1. قم بتحميل برنامج **Sideloadly** المجاني على جهاز الكمبيوتر من: https://sideloadly.io
            2. وصّل الآيفون بالكمبيوتر عبر كابل USB ووافق على "الوثوق بهذا الكمبيوتر".
            3. اسحب ملف `sanai3y.ipa` المرفق وأفلته داخل نافذة Sideloadly واضغط **Start**.
            4. في الآيفون: افتح **الإعدادات > عام > إدارة الجهاز وVPN** ثم اضغط **وثوق (Trust)**.
          files: sanai3y.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build & Deploy Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Supabase Secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_LOCAL_JSON }}" ]; then
            echo '${{ secrets.SUPABASE_LOCAL_JSON }}' > supabase.local.json
          elif [ -f "supabase.local.json" ]; then
            echo "Using existing repository supabase.local.json configuration."
          else
            echo '{"SUPABASE_URL":"https://oflqzgnbpbufoxzynaoq.supabase.co","SUPABASE_PUBLISHABLE_KEY":"sb_publishable_FwtdXZHRA0k-mEIzUO20lA_RBbNo_Gu"}' > supabase.local.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web (PWA)
        run: |
          flutter build web --release --base-href="/sanai3y-app/" --dart-define-from-file=supabase.local.json

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
